# Re-runs the local guardrails server-side so `git commit --no-verify` cannot skip them.
name: ai-guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install "pre-commit==4.7.0" "pytest>=8" "pyyaml>=6"

      - name: Guardrail unit tests
        run: python -m pytest

      - name: Pre-commit (all files)
        env:
          # Branch protection, not this hook, guards main in CI.
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure
